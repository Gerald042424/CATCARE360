name: Deploy to Serv00

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: serv00-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mysqli
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Configure the SSH deployment key
        env:
          SERV00_HOST: ${{ secrets.SERV00_HOST }}
          SERV00_SSH_PRIVATE_KEY: ${{ secrets.SERV00_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SERV00_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERV00_HOST" >> ~/.ssh/known_hosts

      - name: Sync application and public files
        env:
          SERV00_HOST: ${{ secrets.SERV00_HOST }}
          SERV00_USERNAME: ${{ secrets.SERV00_USERNAME }}
          SERV00_DOMAIN: ${{ secrets.SERV00_DOMAIN }}
        run: |
          remote_root="/usr/home/${SERV00_USERNAME}/domains/${SERV00_DOMAIN}"
          ssh "${SERV00_USERNAME}@${SERV00_HOST}" "mkdir -p '${remote_root}/app' '${remote_root}/public_html/uploads/applications' '${remote_root}/writable/cache' '${remote_root}/writable/logs' '${remote_root}/writable/session'"

          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'public/' \
            --exclude 'writable/' \
            --exclude 'tests/' \
            ./ "${SERV00_USERNAME}@${SERV00_HOST}:${remote_root}/app/"

          rsync -az --delete \
            --exclude 'uploads/' \
            public/ "${SERV00_USERNAME}@${SERV00_HOST}:${remote_root}/public_html/"

      - name: Set safe writable permissions
        env:
          SERV00_HOST: ${{ secrets.SERV00_HOST }}
          SERV00_USERNAME: ${{ secrets.SERV00_USERNAME }}
          SERV00_DOMAIN: ${{ secrets.SERV00_DOMAIN }}
        run: |
          remote_root="/usr/home/${SERV00_USERNAME}/domains/${SERV00_DOMAIN}"
          ssh "${SERV00_USERNAME}@${SERV00_HOST}" "chmod -R u+rwX '${remote_root}/writable' '${remote_root}/public_html/uploads'"
